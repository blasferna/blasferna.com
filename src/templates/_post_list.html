<div class="divide-y divide-paper-200 dark:divide-paper-850">
    {% for post in posts %}
    <article class="group relative py-8">
        <div class="sm:grid sm:grid-cols-[10rem_1fr] sm:gap-6">
            <p class="font-mono text-xs uppercase leading-6 tracking-[0.14em] text-paper-600 dark:text-paper-400">
                <time datetime="{{post.date}}">{{post.formatted_date}}</time>
            </p>
            <div class="mt-2 sm:mt-0">
                <h3 class="font-display text-xl font-semibold leading-snug tracking-tight transition-colors group-hover:text-rust-700 dark:group-hover:text-rust-300">
                    <a href="{% if post.language != default_lang %}/{{ post.language }}{% endif %}/articles/{{ post.slug }}">
                        <span class="absolute inset-0"></span>{{post.title}}<span class="sr-only">, {{post.formatted_date}}</span>
                    </a>
                </h3>
                <p class="mt-2 line-clamp-2 leading-relaxed text-paper-600 dark:text-paper-400">{{post.summary}}</p>
                <p class="mt-3 font-mono text-xs uppercase tracking-[0.14em] text-rust-600 dark:text-rust-300">
                    {{config.i18n.read_more}} <span aria-hidden="true" class="inline-block transition-transform group-hover:translate-x-1">&rarr;</span>
                </p>
            </div>
        </div>
    </article>
    {% endfor %}
</div>
